global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets:
          - "vllm-fast:8000"
          - "vllm-balanced:8000"
          - "vllm-large:8000"


[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-stack-tools"
version = "0.1.0"
description = "Operational tooling and static checks for the local LLM stack"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
